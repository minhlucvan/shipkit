<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">ShipKit — ship your process, not a fork</title>
  <desc id="desc">Dark cover with the ShipKit wordmark, the line "Ship your process, not a fork." and an isometric three-plate mark inside an orbit ring. ShipKit is a project-independent process kernel for agent-built software: one CLI, one standard template, the gate, the ledger and the wave loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0a1120"/>
      <stop offset="1" stop-color="#0d1730"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4ce0b3" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#2f6bff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7bf7cf"/>
      <stop offset="1" stop-color="#37c9a3"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb4ff"/>
      <stop offset="1" stop-color="#4f7dff"/>
    </linearGradient>
    <linearGradient id="plateTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ce0b3" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0.16"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#24365a" stroke-width="1" opacity="0.40"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <rect width="1600" height="800" fill="url(#glow)"/>

  <!-- frame -->
  <rect x="56" y="56" width="1488" height="688" rx="28" fill="none" stroke="#2a3d63" stroke-width="1.5" opacity="0.55"/>

  <!-- eyebrow -->
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="120" y="150" fill="#7bf7cf" font-size="20" font-weight="700" letter-spacing="8">SHIPKIT</text>
    <rect x="282" y="128" width="164" height="34" rx="17" fill="none" stroke="#3a547f" stroke-width="1.2"/>
    <text x="300" y="151" fill="#9fb2d4" font-size="16" font-weight="600" letter-spacing="1.5">0.1.0 · MIT</text>

    <!-- headline -->
    <text x="118" y="300" fill="#f3f7ff" font-size="96" font-weight="750" letter-spacing="-3">Ship your process,</text>
    <text x="118" y="400" fill="url(#mint)" font-size="96" font-weight="750" letter-spacing="-3">not a fork.</text>

    <!-- subtitle -->
    <text x="122" y="470" fill="#a9bad8" font-size="25" font-weight="450">The process kernel for agent-built software — the gate, the ledger, the roadmap</text>
    <text x="122" y="507" fill="#a9bad8" font-size="25" font-weight="450">and the wave loop, in one CLI and one standard template.</text>

    <!-- chips -->
    <g font-size="16" font-weight="600" letter-spacing="1.2">
      <rect x="122" y="558" width="136" height="40" rx="20" fill="none" stroke="#33517f"/>
      <text x="150" y="584" fill="#cfe0ff">OpenSpec</text>
      <rect x="272" y="558" width="96" height="40" rx="20" fill="none" stroke="#33517f"/>
      <text x="300" y="584" fill="#cfe0ff">gate</text>
      <rect x="382" y="558" width="140" height="40" rx="20" fill="none" stroke="#33517f"/>
      <text x="406" y="584" fill="#cfe0ff">roadmap</text>
      <rect x="536" y="558" width="160" height="40" rx="20" fill="none" stroke="#33517f"/>
      <text x="560" y="584" fill="#cfe0ff">wave loop</text>
      <rect x="710" y="558" width="186" height="40" rx="20" fill="none" stroke="#33517f"/>
      <text x="734" y="584" fill="#cfe0ff">one template</text>
    </g>

    <!-- footer -->
    <text x="122" y="678" fill="#7487a8" font-size="18" font-weight="500">github.com/minhlucvan/shipkit</text>
    <circle cx="412" cy="672" r="3" fill="#3f5b8a"/>
    <text x="430" y="678" fill="#7487a8" font-size="18" font-weight="500">install from a release bundle</text>
    <circle cx="706" cy="672" r="3" fill="#3f5b8a"/>
    <text x="724" y="678" fill="#7487a8" font-size="18" font-weight="500">no npm publication</text>
  </g>

  <!-- mark: an orbit ring around a three-plate stack -->
  <g transform="translate(1180 380)">
    <ellipse cx="0" cy="0" rx="350" ry="152" fill="none" stroke="#35578c" stroke-width="1.4" stroke-dasharray="5 10" transform="rotate(-22)"/>
    <ellipse cx="0" cy="0" rx="350" ry="152" fill="none" stroke="#4ce0b3" stroke-width="1.6" stroke-dasharray="54 640" transform="rotate(-22)" opacity="0.85"/>
    <circle cx="318" cy="-98" r="7" fill="#7bf7cf"/>
    <circle cx="318" cy="-98" r="16" fill="#4ce0b3" opacity="0.24" filter="url(#soft)"/>

    <!-- plate 3, top -->
    <g transform="translate(0 -108)">
      <path d="M0 -118 L212 0 L0 118 L-212 0 Z" fill="url(#plateTop)" stroke="url(#mint)" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#7bf7cf"/>
    </g>
    <!-- plate 2 -->
    <g transform="translate(0 0)">
      <path d="M0 -118 L212 0 L0 118 L-212 0 Z" fill="#0c1a30" fill-opacity="0.55" stroke="url(#blue)" stroke-width="1.7" opacity="0.85"/>
      <circle cx="0" cy="0" r="5" fill="#8fb4ff"/>
    </g>
    <!-- plate 1, bottom -->
    <g transform="translate(0 108)">
      <path d="M0 -118 L212 0 L0 118 L-212 0 Z" fill="#0a1526" fill-opacity="0.5" stroke="#35578c" stroke-width="1.5" opacity="0.8"/>
      <circle cx="0" cy="0" r="4.5" fill="#5c83bd"/>
    </g>
    <!-- keel line through the stack -->
    <line x1="0" y1="-230" x2="0" y2="230" stroke="#3c5c8f" stroke-width="1.2" stroke-dasharray="3 7" opacity="0.8"/>
    <text x="0" y="292" text-anchor="middle" fill="#6f86ab" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3">KERNEL · TEMPLATE · PROJECT</text>
  </g>
</svg>
